version: "2"
sql:
  - engine: "mysql"
    schema: "database/climblive.sql"
    queries: "database/queries.sql"
    gen:
      go:
        package: "database"
        out: "internal/database"
        rename:
          comp_class: "Category"
          class_id: "CategoryID"
          contender: "Competitor"
          contender_id: "CompetitorID"
        overrides:
          - column: "competition.id"
            go_type:
              import: "github.com/climblive/platform/backend/internal/domain"
              type: "CompetitionID"
          - column: "*.competition_id"
            go_type:
              import: "github.com/climblive/platform/backend/internal/domain"
              type: "CompetitionID"
